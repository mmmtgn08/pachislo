name: moshimo-stats

# 毎日、投稿した動画の再生数を記録して moshimo/STATS.md を更新する。
on:
  schedule:
    - cron: "17 21 * * *" # 毎朝 6:17(日本時間)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: moshimo-stats
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: moshimo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -q -r requirements.txt

      - name: Fetch stats
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python tools/stats.py >> "$GITHUB_STEP_SUMMARY"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json stats_history.jsonl STATS.md
          git diff --cached --quiet && exit 0
          git commit -m "Stats: $(date -u +%F)"
          for i in 1 2 3 4; do
            git pull --rebase -q && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
