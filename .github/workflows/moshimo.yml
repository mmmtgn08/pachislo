name: moshimo

# 「もしも」3Dショート。Claude の定期タスクが台本JSONを渡して起動する。
on:
  workflow_dispatch:
    inputs:
      script_json:
        description: "台本JSON(文字列)。空なら script_path を使う"
        required: false
        default: ""
      script_path:
        description: "台本JSONのパス(テスト用)"
        required: false
        default: "moshimo/topics/oxygen.json"
      privacy:
        description: "public / unlisted / private (空ならリポジトリ変数 MOSHIMO_YT_PRIVACY → public)"
        required: false
        default: ""
      dry_run:
        description: "true なら投稿せず動画だけ作る"
        required: false
        default: "false"
      preview:
        description: "true なら動画を previews ブランチに置く(チャットで確認する用)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: moshimo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150 # 長尺動画(8〜12分)は描画に1時間前後かかる
    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-latest
        ports:
          - 50021:50021
    defaults:
      run:
        working-directory: moshimo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: moshimo/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fonts and packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-noto-cjk fonts-noto-cjk-extra
          npm ci
          npx remotion browser ensure
          pip install -q -r requirements.txt

      - name: Prepare script
        env:
          SCRIPT_JSON: ${{ inputs.script_json }}
          SCRIPT_PATH: ${{ inputs.script_path }}
        run: |
          if [ -n "$SCRIPT_JSON" ]; then
            printf '%s' "$SCRIPT_JSON" > script.json
          else
            cp "../$SCRIPT_PATH" script.json
          fi

      - name: Render
        env:
          VOICEVOX_URL: http://127.0.0.1:50021
        run: node scripts/render.mjs script.json --out out/video.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: moshimo-video
          path: |
            moshimo/out/video.mp4
            moshimo/out/video.thumb.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish preview
        if: inputs.preview == 'true'
        working-directory: .
        run: |
          cp moshimo/out/video.mp4 "$RUNNER_TEMP/moshimo-preview.mp4"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan previews
          git rm -rfq . >/dev/null
          git clean -fdxq
          cp "$RUNNER_TEMP/moshimo-preview.mp4" moshimo-preview.mp4
          git add moshimo-preview.mp4
          git commit -qm "Preview: ${{ github.run_id }}"
          git push -qf origin previews

      - name: Upload to YouTube
        id: upload
        if: inputs.dry_run != 'true'
        working-directory: .
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ inputs.privacy || vars.MOSHIMO_YT_PRIVACY }}
        run: |
          if [ -z "$YT_REFRESH_TOKEN" ]; then
            echo "::warning::YT_REFRESH_TOKEN が未設定のため投稿しません"
            exit 0
          fi
          VID=$(python moshimo/tools/upload.py moshimo/out/video.mp4 moshimo/out/video.meta.json | tail -1)
          echo "video_id=$VID" >> "$GITHUB_OUTPUT"
          echo "### 投稿完了: https://youtube.com/shorts/$VID" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to TikTok
        # TikTok の認証情報が登録されていれば、ショートを TikTok にも投稿する（失敗しても YouTube の記録は続ける）
        id: tiktok
        if: inputs.dry_run != 'true' && hashFiles('moshimo/out/video.thumb.png') == ''
        continue-on-error: true
        working-directory: .
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_PRIVACY: ${{ vars.TIKTOK_PRIVACY }}
        run: |
          if [ -z "$TIKTOK_REFRESH_TOKEN" ]; then
            echo "TikTok の認証情報が未登録のため、TikTok への投稿はしません"
            exit 0
          fi
          python moshimo/tools/tiktok.py upload moshimo/out/video.mp4 moshimo/out/video.meta.json
          echo "### TikTok にも投稿しました" >> "$GITHUB_STEP_SUMMARY"

      - name: Post engagement comment
        if: steps.upload.outputs.video_id != ''
        continue-on-error: true
        working-directory: .
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python moshimo/tools/comments.py post "${{ steps.upload.outputs.video_id }}" moshimo/script.json

      - name: Record history
        if: inputs.script_json != '' && inputs.dry_run != 'true' && steps.upload.outputs.video_id != ''
        run: |
          node scripts/record.mjs script.json out/video.meta.json "${{ steps.upload.outputs.video_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.jsonl topics/posted topics/posted_long 2>/dev/null || git add history.jsonl topics/posted
          git commit -m "Add moshimo short: $(date -u +%F)"
          for i in 1 2 3 4; do
            git pull --rebase -q && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
